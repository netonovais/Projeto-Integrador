<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | Portal Acadêmico de Projetos</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="govbar">
    <div class="container govbar-content">
      <span>Ambiente institucional</span>
      <div class="govbar-links">
        <a href="contato.html">Acesso à informação</a>
        <a href="contato.html">Ouvidoria</a>
        <a href="contato.html">Transparência</a>
      </div>
    </div>
  </div>

  <section class="login-wrapper">
    <div class="login-card">
      <span class="section-tag">Cadastro demonstrativo</span>
      <h1>Criar conta</h1>
      <p>
        Este cadastro é apenas ilustrativo e serve para simular a navegação do usuário dentro do protótipo final.
      </p>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="cadastroNome">Nome completo</label>
          <input class="input" type="text" id="cadastroNome" placeholder="Digite seu nome completo" />
        </div>

        <div class="form-group">
          <label for="cadastroEmail">E-mail</label>
          <input class="input" type="email" id="cadastroEmail" placeholder="Digite seu e-mail" />
        </div>

        <div class="form-group">
          <label for="cadastroCurso">Curso</label>
          <input class="input" type="text" id="cadastroCurso" placeholder="Digite seu curso" />
        </div>

        <div class="form-group">
          <label for="cadastroSenha">Senha</label>
          <input class="input" type="password" id="cadastroSenha" placeholder="Crie uma senha" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Concluir cadastro</button>
      </form>

      <div class="login-links">
        <a class="muted-link" href="login.html">Já tenho conta</a>
        <a class="muted-link" href="../index.html">Voltar ao início</a>
      </div>
    </div>
  </section>

  <script src="../script.js"></script>
</body>
</html>
