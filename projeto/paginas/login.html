<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Portal Acadêmico de Projetos</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="topbar">
    <div class="container topbar-content">
      <span>Ambiente institucional</span>
      <div class="topbar-links">
        <a href="contato.html">Atendimento</a>
        <a href="contato.html">Suporte</a>
        <a href="../index.html">Página inicial</a>
      </div>
    </div>
  </div>

  <section class="login-wrapper">
    <div class="login-card">
      <span class="eyebrow">Acesso ao portal</span>
      <h1>Entrar</h1>
      <p>
        Faça login para acessar o catálogo de projetos, publicar novas iniciativas
        e navegar pelo ambiente acadêmico demonstrativo.
      </p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginNome">Nome</label>
          <input class="input" type="text" id="loginNome" placeholder="Digite seu nome" />
        </div>

        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input class="input" type="email" id="loginEmail" placeholder="Digite seu e-mail" />
        </div>

        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input class="input" type="password" id="loginSenha" placeholder="Digite sua senha" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar no portal</button>
      </form>

      <div class="login-links">
        <a class="text-link" href="../index.html">Voltar ao início</a>
        <a class="text-link" href="cadastro.html">Criar cadastro</a>
      </div>
    </div>
  </section>

  <script src="../script.js"></script>
</body>
</html>
