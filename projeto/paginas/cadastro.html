<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | Portal Acadêmico de Projetos</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="topbar">
    <div class="container topbar-content">
      <span>Ambiente institucional</span>
      <div class="topbar-links">
        <a href="../index.html">Página inicial</a>
        <a href="login.html">Entrar</a>
        <a href="contato.html">Atendimento</a>
      </div>
    </div>
  </div>

  <section class="login-wrapper">
    <div class="login-card">
      <span class="eyebrow">Cadastro demonstrativo</span>
      <h1>Criar conta</h1>
      <p>
        Cadastro ilustrativo para simular o fluxo de acesso e navegação do usuário
        dentro do protótipo final.
      </p>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="cadastroNome">Nome completo</label>
          <input class="input" type="text" id="cadastroNome" placeholder="Digite seu nome completo" />
        </div>

        <div class="form-group">
          <label for="cadastroEmail">E-mail</label>
          <input class="input" type="email" id="cadastroEmail" placeholder="Digite seu e-mail" />
        </div>

        <div class="form-group">
          <label for="cadastroCurso">Curso</label>
          <input class="input" type="text" id="cadastroCurso" placeholder="Digite seu curso" />
        </div>

        <div class="form-group">
          <label for="cadastroSenha">Senha</label>
          <input class="input" type="password" id="cadastroSenha" placeholder="Crie uma senha" />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Concluir cadastro</button>
      </form>

      <div class="login-links">
        <a class="text-link" href="login.html">Já tenho conta</a>
        <a class="text-link" href="../index.html">Voltar ao início</a>
      </div>
    </div>
  </section>

  <script src="../script.js"></script>
</body>
</html>
